name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Deployment is manual (see docs/DEPLOYMENT.md). This workflow only checks that the
# site still type-checks and builds. A newer push supersedes an older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # An Astro build takes seconds; a job that has run for ten minutes is stuck.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The only gate this repo has: there is no test suite, so a build that succeeds
      # is the whole signal. It does catch the failure that actually happens here —
      # a malformed src/data/site.ts, which is where every content change lands.
      # Astro's equivalent of `tsc`: it type-checks the .astro templates as well as the
      # .ts files, which a bare `tsc` cannot see into.
      - name: Type-check
        run: npx astro check

      - name: Build
        run: npm run build
